name: AURA Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  foundation:
    name: Foundation checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Persist initial lockfile
        if: github.event_name == 'pull_request'
        run: |
          if git ls-files --error-unmatch pnpm-lock.yaml >/dev/null 2>&1; then
            echo 'pnpm-lock.yaml is already tracked.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'chore: lock workspace dependencies'
          git push origin HEAD:${{ github.head_ref }}

      - name: Doctor
        run: pnpm run doctor

      - name: Verify foundation
        run: pnpm run verify
